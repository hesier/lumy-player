name = "lumy-danmaku-proxy"
main = "src/index.mjs"
compatibility_date = "2025-05-05"
workers_dev = false
preview_urls = false

[observability]
enabled = false

[[ratelimits]]
name = "CLIENT_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "UPSTREAM_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
