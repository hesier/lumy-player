name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 只发布已经合并进 main 的提交，避免误把 dev 上的 tag 发出去
      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # tag 必须和 versionName 一致，避免发布出版本号对不上的包
      - name: Check tag matches versionName
        run: |
          version=$(sed -nE 's/^ *versionName = "(.*)"/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      # 更新日志里没有这个版本时在构建前就失败；--generate-notes 只会在后面追加对比链接
      - name: Extract release notes
        run: |
          bash .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          bash .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" en > "$RUNNER_TEMP/notes-en.md"
          bash .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" zh > "$RUNNER_TEMP/notes-zh.md"

      # 没配置签名 secrets 时直接失败，不能退回 debug 签名发布
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: ./gradlew :core:test :net:test :server-plex:test :server-jellyfin:test

      - name: Build release APK
        env:
          LUMY_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          LUMY_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          LUMY_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          LUMY_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then
            echo "::error::Release APK is signed with the debug key"
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="lumy-player-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          # 应用内更新从 releases/latest/download/update.json 取版本信息，直连和走镜像都用这一个文件
          jq -n \
            --argjson versionCode "$(sed -nE 's/^ *versionCode = ([0-9]+)/\1/p' app/build.gradle.kts)" \
            --arg versionName "${GITHUB_REF_NAME#v}" \
            --arg apk "$apk" \
            --argjson size "$(stat -c %s "$apk")" \
            --arg sha256 "$(cut -d' ' -f1 "$apk.sha256")" \
            --rawfile en "$RUNNER_TEMP/notes-en.md" \
            --rawfile zh "$RUNNER_TEMP/notes-zh.md" \
            '{versionCode: $versionCode, versionName: $versionName, apk: $apk, size: $size, sha256: $sha256, notes: {en: $en, zh: $zh}}' \
            > update.json
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" update.json --title "Lumy Player $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
